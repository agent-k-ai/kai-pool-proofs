[package]
name = "volume-chunk-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
groth16-native = ["sp1-sdk/native-gnark"]

[[bin]]
name = "volume-range-groth16"
path = "src/bin/volume-range-groth16.rs"
required-features = ["groth16-native"]

[dependencies]
sp1-sdk = { version = "=6.7.0", default-features = false }
kai-volume-chunk = { path = "../chunk" }
kai-volume-core = { path = "../core" }
kai-volume-range = { path = "../range" }
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
hex.workspace = true
sp1-prover = "=6.7.0"
bincode = "=1.3.3"
