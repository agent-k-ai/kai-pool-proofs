[workspace]
members = ["primitives", "core", "trie", "chunk", "guest", "host", "build"]
default-members = ["primitives", "core", "trie", "chunk"]
resolver = "2"

[workspace.package]
version = "0.1.0-eval.20260912d"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
hex = "=0.4.3"
serde_json = "=1.0.149"
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }

[patch.crates-io]
tiny-keccak = { git = "https://github.com/sp1-patches/tiny-keccak", rev = "957430a459f7a2332ab5bab4a12f9b473bb95c87" }

[profile.release]
opt-level = 3
overflow-checks = true

[profile.dev]
codegen-units = 1

[profile.test]
codegen-units = 1
